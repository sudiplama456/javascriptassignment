<!DOCTYPE html>
<html>
<head>
    <title>Sort Array Function</title>
</head>
<body>
    <script>
        function sortArray(numbers, order = "asc") {
            const sorted = [...numbers];
            order === "desc" ? sorted.sort((a, b) => b - a) : sorted.sort((a, b) => a - b);
            return sorted;
        }

        // Quick test
        const numbers = [5, 2, 8, 1, 9];
        console.log("Original:", numbers);
        console.log("Ascending:", sortArray(numbers, "asc"));
        console.log("Descending:", sortArray(numbers, "desc"));
    </script>
</body>
</html>
